<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Slideshow</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; }
    footer {
      height: 7vh;
      background: #722F37;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font: 600 3.5vh/1 sans-serif;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <!-->BAGGE TEST<!---> 
  <iframe id="show" allowfullscreen></iframe>
  <script>
    const BASE = "https://docs.google.com/presentation/d/e/2PACX-1vQMAlycKbBwguEwaqnkt-lNsLXSEEwrImGAM0AggtrQWvTqV6erpZTRfOHyOf2M8rhvqknyM5bN8Yh1/pubembed?start=true&loop=true&delayms=3000";
    const RELOAD_MINUTES = 15;

    function load() {
      document.getElementById("show").src = BASE + "&t=" + Date.now();
    }
    load();
    setInterval(load, RELOAD_MINUTES * 60 * 1000);
  </script>

<footer>Se mer info på anslagstavlan</footer>
</body>
</html>
